spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/matchflixdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Secrets: no defaults on purpose. The app must fail loudly if they are unset
# rather than start with a guessable value. See .env.example.
tmdb.api.key=${TMDB_API_KEY}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
server.port=${SERVER_PORT:8080}

# --- RECO/ML ---
reco.userSalt=${RECO_USER_SALT}
ml.baseUrl=${ML_BASE_URL:http://localhost:8000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=${APP_UPLOAD_DIR:uploads}
